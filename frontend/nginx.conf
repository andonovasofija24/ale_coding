server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # index.html must never be cached: it points to the current hashed JS/CSS files.
    # Without this, browsers can keep an old index.html and show an old version of the app after a rebuild.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires off;
    }

    # Built assets have a content hash in their file name, so they can be cached "forever".
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        client_max_body_size 70m;  # document / project uploads (the backend checks the real limits)
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}

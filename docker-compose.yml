services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ale
      POSTGRES_PASSWORD: ale_password
      POSTGRES_DB: ale_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ale -d ale_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  code-runner:
    build:
      context: ./code-runner
      dockerfile: Dockerfile
    environment:
      - RUNNER_SECRET=runner_secret_change_me
    networks:
      - internal
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql+asyncpg://ale:ale_password@db:5432/ale_db
      - SECRET_KEY=supersecretkey_change_in_production
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - CODE_RUNNER_URL=http://code-runner:8001
      - CODE_RUNNER_SECRET=runner_secret_change_me
      - FIRST_ADMIN_EMAIL=${FIRST_ADMIN_EMAIL:-admin@example.com}
      - FIRST_ADMIN_PASSWORD=${FIRST_ADMIN_PASSWORD:-adminpassword}
      - FIRST_ADMIN_NAME=${FIRST_ADMIN_NAME:-Admin}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      code-runner:
        condition: service_started
    networks:
      - internal
      - default
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8000
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  internal:
    internal: true
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ale
      POSTGRES_PASSWORD: ale_password
      POSTGRES_DB: ale_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ale -d ale_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Throwaway PostgreSQL for PostgreSQL tasks: every test gets its own database, dropped right after.
  # Only the code runner can reach it; its data lives in memory and is gone on restart.
  sql-sandbox:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${PG_SANDBOX_SUPERUSER_PASSWORD:-sandbox_superuser_change_me}
      PG_SANDBOX_ADMIN_PASSWORD: ${PG_SANDBOX_ADMIN_PASSWORD:-sandbox_admin_change_me}
      PG_SANDBOX_STUDENT_PASSWORD: student_password_replaced_by_the_runner
    command: >
      postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off
               -c max_connections=60 -c shared_buffers=64MB -c client_connection_check_interval=1000
    volumes:
      - ./sql-sandbox/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    tmpfs:
      - /var/lib/postgresql/data:size=512m
    networks:
      - internal
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  code-runner:
    build:
      context: ./code-runner
      dockerfile: Dockerfile
    environment:
      - RUNNER_SECRET=runner_secret_change_me
      - RUNNER_WORKERS=${RUNNER_WORKERS:-4}  # submissions tested at the same time; the rest wait in a queue
      - PG_SANDBOX_HOST=sql-sandbox
      - PG_SANDBOX_ADMIN_PASSWORD=${PG_SANDBOX_ADMIN_PASSWORD:-sandbox_admin_change_me}
    depends_on:
      sql-sandbox:
        condition: service_healthy
    networks:
      - internal  # internal network only: no internet, and no access to the database
    # Sandbox for student code (see code-runner/app/sandbox.py)
    init: true  # a tiny init process reaps killed programs, so zombies can't pile up
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /sandbox:size=512m,mode=0711,exec  # compiled programs run from here (tmpfs is noexec by default)
    cap_drop:
      - ALL
    cap_add:  # only what is needed to run each submission as its own unprivileged user and clean up after it
      - SETUID
      - SETGID
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - KILL
    security_opt:
      - no-new-privileges:true
    pids_limit: 1024  # headless Chromium (HTML/CSS tasks) uses many threads
    mem_limit: 2g
    cpus: 2.0
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql+asyncpg://ale:ale_password@db:5432/ale_db
      - SECRET_KEY=supersecretkey_change_in_production
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - CODE_RUNNER_URL=http://code-runner:8001
      - CODE_RUNNER_SECRET=runner_secret_change_me
      - FIRST_ADMIN_EMAIL=${FIRST_ADMIN_EMAIL:-admin@example.com}
      - FIRST_ADMIN_PASSWORD=${FIRST_ADMIN_PASSWORD:-adminpassword}
      - FIRST_ADMIN_NAME=${FIRST_ADMIN_NAME:-Admin}
      # Sign in with Microsoft (off unless MS_CLIENT_ID and MS_CLIENT_SECRET are set in .env)
      - MS_CLIENT_ID=${MS_CLIENT_ID:-}
      - MS_CLIENT_SECRET=${MS_CLIENT_SECRET:-}
      - MS_TENANT_ID=${MS_TENANT_ID:-organizations}
      - MS_ALLOWED_DOMAINS=${MS_ALLOWED_DOMAINS:-}
      - PUBLIC_URL=${PUBLIC_URL:-http://localhost:8000}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - TRUST_PROXY_HEADERS=${TRUST_PROXY_HEADERS:-false}
      # per-student limits (0 = no limit); admins are never limited
      - RATE_AI_PER_MINUTE=${RATE_AI_PER_MINUTE:-10}
      - RATE_AI_PER_DAY=${RATE_AI_PER_DAY:-300}
      - LOG_RETENTION_DAYS=${LOG_RETENTION_DAYS:-180}
      - STUDENT_EMAIL_DOMAINS=${STUDENT_EMAIL_DOMAINS:-students.finki.ukim.mk}
      - TEACHER_EMAIL_DOMAINS=${TEACHER_EMAIL_DOMAINS:-finki.ukim.mk}
      - RATE_TESTS_PER_MINUTE=${RATE_TESTS_PER_MINUTE:-20}
      # Exams: submissions are tested this many at a time (= RUNNER_WORKERS × code-runner replicas); the rest wait
      - SUBMISSION_WORKERS=${SUBMISSION_WORKERS:-${RUNNER_WORKERS:-4}}
      - DB_POOL_SIZE=${DB_POOL_SIZE:-20}
      - DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW:-30}
      # E-mail: preview (nothing is sent, shown under Admin → Mail) | smtp | microsoft (Graph, Mail.Send)
      - MAIL_MODE=${MAIL_MODE:-preview}
      - MAIL_FROM=${MAIL_FROM:-ale@localhost}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-ALE}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_SECURITY=${SMTP_SECURITY:-starttls}
      - REMINDER_CHECK_MINUTES=${REMINDER_CHECK_MINUTES:-5}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      code-runner:
        condition: service_started
    networks:
      - internal
      - default
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8000
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  internal:
    internal: true